name: Verify build artifacts are up to date

# Why this exists: cartridges/int_reachfive_sfra/cartridge/static/default/js/reachfiveglobal.js
# is a compiled copy of client/default/js/reachfiveglobal.js, generated by `npm run compile:js`.
# SFCC serves the compiled (static) file directly, so if someone edits the source file and
# forgets to re-run the build before committing, the browser silently keeps using the old
# compiled code with no error - exactly what happened in CA-6230-adjacent state management work
# (reach5Const.stateObjBase64 lingered in the compiled file after the source was renamed to
# reach5Const.state, breaking the silent loginFromSession re-auth path).
#
# This workflow re-runs the same build PRs already require and fails if that produces any
# difference from what was committed, so this class of bug can't merge silently again.

on:
  pull_request:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR's code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Rebuild int_reachfive_sfra client JS
        run: npm run compile:js

      - name: Fail if the rebuild changed anything that was committed
        run: |
          if ! git diff --quiet -- cartridges/int_reachfive_sfra/cartridge/static; then
            echo "::error::The compiled JS under cartridges/int_reachfive_sfra/cartridge/static is out of date."
            echo "This means client/default/js/reachfiveglobal.js was edited without re-running the build."
            echo ""
            echo "To fix: run 'npm run compile:js' locally, then commit the resulting changes"
            echo "under cartridges/int_reachfive_sfra/cartridge/static/default/js/."
            echo ""
            echo "Diff that would need to be committed:"
            git diff -- cartridges/int_reachfive_sfra/cartridge/static
            exit 1
          fi
          echo "Compiled JS matches the source. Nothing to do."
